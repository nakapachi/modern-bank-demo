<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顧客詳細｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body class="admin-page">
<aside class="admin-sidebar"><a class="admin-logo" th:href="@{/admin}"><img th:src="@{/images/hato-bank-logo.svg}" alt="はと銀行"></a><span class="admin-mode">管理システム</span><nav><a th:href="@{/admin}">ダッシュボード</a><a class="active" th:href="@{/admin/customers}">顧客管理</a><a th:href="@{/admin/customers/new}">顧客登録・口座開設</a><a th:href="@{/admin/branches}">本支店一覧</a></nav><div class="admin-sidebar-note">銀行コード 9999<br>本店営業部 001</div></aside>
<div class="admin-shell"><header class="admin-header"><div><small>CUSTOMER DETAIL</small><h1>顧客詳細</h1></div><div class="admin-user"><span th:text="${loginName}">admin</span><b>管理者</b><form th:action="@{/logout}" method="post"><button>ログアウト</button></form></div></header><main class="admin-main"><div class="admin-success" th:if="${success}" th:text="${success}"></div><div class="admin-error" th:if="${error}" th:text="${error}"></div>
<section class="customer-summary"><div><small>顧客番号</small><code th:text="${customer.customerNumber}"></code></div><div><small>氏名</small><strong th:text="${customer.displayName}"></strong></div><div><small>ユーザーID</small><b th:text="${customer.username}"></b></div><span class="status-pill" th:classappend="${customer.status.name()=='SUSPENDED'}?' danger'" th:text="${customer.status.name()=='ACTIVE'?'利用中':'停止中'}"></span></section>
<div class="admin-columns"><section class="admin-panel form-panel"><div class="panel-heading"><div><span>CUSTOMER PROFILE</span><h2>顧客情報</h2></div><a th:href="@{/admin/customers}">‹ 顧客一覧へ</a></div><form class="admin-form" th:action="@{/admin/customers/{id}(id=${customer.id})}" method="post"><div class="form-grid one-column"><label>氏名<input name="displayName" th:value="${customer.displayName}" required></label><label>メールアドレス<input type="email" name="email" th:value="${customer.email}"></label><label>電話番号<input name="phone" th:value="${customer.phone}"></label><label>顧客状態<select name="status"><option th:each="s:${statuses}" th:value="${s}" th:selected="${s==customer.status}" th:text="${s.name()=='ACTIVE'?'利用中':'利用停止'}"></option></select></label></div><div class="form-actions"><button>顧客情報を更新</button></div></form></section>
<section class="admin-panel form-panel"><div class="panel-heading"><div><span>OPEN ACCOUNT</span><h2>口座開設</h2></div></div><form class="admin-form" th:action="@{/admin/customers/{id}/accounts(id=${customer.id})}" method="post"><div class="form-grid one-column"><label>取扱支店<select name="branchCode" required><option th:each="branch:${branches}" th:value="${branch.code}" th:text="${branch.code+' '+branch.name+'（'+branch.location+'）'}"></option></select></label><div class="auto-number-note"><b>口座番号は自動採番されます</b><small>支店・科目別の一連番号にチェックデジットを付加します。採番済み番号は再使用しません。</small></div><label>口座種別<select name="accountType"><option th:each="t:${accountTypes}" th:value="${t}" th:text="${t.name()=='ORDINARY'?'普通預金（1番帯）':'貯蓄預金（2番帯）'}"></option></select></label><label>初期残高<input type="number" name="initialBalance" min="0" step="0.01" value="0" required></label></div><div class="form-actions"><button>口座番号を採番して開設</button></div></form></section></div>
<section class="admin-panel accounts-panel"><div class="panel-heading"><div><span>ACCOUNTS</span><h2>保有口座</h2></div><b th:text="${#lists.size(accounts)}+'口座'"></b></div><div class="account-admin-grid"><article th:each="account:${accounts}"><div class="account-admin-top"><div><small th:text="${account.branchDisplayName}">本店営業部（001）</small><b th:text="${account.accountType.name()=='ORDINARY'?'普通預金':'貯蓄預金'}"></b><code th:text="${account.accountNumber}"></code></div><span class="status-pill" th:classappend="${account.status.name()!='ACTIVE'}?' danger'" th:text="${account.status.name()=='ACTIVE'?'利用中':account.status.name()=='FROZEN'?'凍結':'解約'}"></span></div><strong th:text="${#numbers.formatDecimal(account.balance,1,'COMMA',0,'POINT')}+' 円'"></strong><form th:action="@{/admin/customers/{customerId}/accounts/{accountId}/status(customerId=${customer.id},accountId=${account.id})}" method="post"><select name="status"><option th:each="s:${accountStatuses}" th:value="${s}" th:selected="${s==account.status}" th:text="${s.name()=='ACTIVE'?'利用中':s.name()=='FROZEN'?'凍結':'解約'}"></option></select><button>状態を更新</button></form></article><p class="empty-cell" th:if="${#lists.isEmpty(accounts)}">口座はまだありません。</p></div></section></main></div></body></html>
