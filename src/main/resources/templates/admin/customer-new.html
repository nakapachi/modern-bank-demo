<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新規顧客登録｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body class="admin-page">
<aside class="admin-sidebar"><a class="admin-logo" th:href="@{/admin}"><img th:src="@{/images/hato-bank-logo.svg}" alt="はと銀行"></a><span class="admin-mode">管理システム</span><nav><a th:href="@{/admin}">ダッシュボード</a><a th:href="@{/admin/customers}">顧客管理</a><a class="active" th:href="@{/admin/customers/new}">顧客登録・口座開設</a><a th:href="@{/admin/branches}">本支店一覧</a></nav><div class="admin-sidebar-note">銀行コード 9999<br>本店営業部 001</div></aside>
<div class="admin-shell"><header class="admin-header"><div><small>NEW CUSTOMER</small><h1>新規顧客登録</h1></div><div class="admin-user"><span th:text="${loginName}">admin</span><b>管理者</b><form th:action="@{/logout}" method="post"><button>ログアウト</button></form></div></header><main class="admin-main"><div class="admin-error" th:if="${error}" th:text="${error}"></div>
<section class="admin-panel form-panel"><div class="panel-heading"><div><span>PROFILE & LOGIN</span><h2>顧客情報とログイン情報</h2></div><a th:href="@{/admin/customers}">‹ 顧客一覧へ</a></div><form class="admin-form" th:action="@{/admin/customers}" method="post"><div class="form-grid"><label>顧客番号<span>必須・C＋6桁</span><input name="customerNumber" pattern="C[0-9]{6}" placeholder="C000003" required autofocus></label><label>氏名<span>必須</span><input name="displayName" maxlength="120" required></label><label>ユーザーID<span>英数字4〜40文字</span><input name="username" pattern="[A-Za-z0-9._-]{4,40}" required></label><label>初期パスワード<span>8文字以上</span><input type="password" name="password" minlength="8" required></label><label>メールアドレス<span>任意</span><input type="email" name="email"></label><label>電話番号<span>任意</span><input name="phone" maxlength="30"></label></div><div class="form-actions"><a th:href="@{/admin/customers}">キャンセル</a><button>顧客を登録</button></div></form></section></main></div></body></html>
