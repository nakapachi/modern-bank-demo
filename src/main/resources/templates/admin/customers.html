<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顧客管理｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body class="admin-page">
<aside class="admin-sidebar"><a class="admin-logo" th:href="@{/admin}"><img th:src="@{/images/hato-bank-logo.svg}" alt="はと銀行"></a><span class="admin-mode">管理システム</span><nav><a th:href="@{/admin}">ダッシュボード</a><a class="active" th:href="@{/admin/customers}">顧客管理</a><a th:href="@{/admin/customers/new}">顧客登録・口座開設</a><a th:href="@{/admin/branches}">本支店一覧</a></nav><div class="admin-sidebar-note">銀行コード 0200<br>本店営業部 001</div></aside>
<div class="admin-shell"><header class="admin-header"><div><small>CUSTOMER MANAGEMENT</small><h1>顧客管理</h1></div><div class="admin-user"><span th:text="${loginName}">admin</span><b>管理者</b><form th:action="@{/logout}" method="post"><button>ログアウト</button></form></div></header><main class="admin-main">
<section class="admin-toolbar"><form method="get" th:action="@{/admin/customers}"><input name="q" th:value="${q}" placeholder="顧客番号・氏名・ユーザーID"><button>検索</button></form><a th:href="@{/admin/customers/new}">＋ 新規顧客登録</a></section>
<section class="admin-panel"><div class="panel-heading"><div><span>CUSTOMERS</span><h2>顧客一覧</h2></div><b th:text="${#lists.size(customers)}+'件'">0件</b></div><div class="admin-table-wrap"><table><thead><tr><th>顧客番号</th><th>氏名</th><th>ユーザーID</th><th>連絡先</th><th>状態</th><th></th></tr></thead><tbody><tr th:each="customer:${customers}"><td><code th:text="${customer.customerNumber}"></code></td><td><b th:text="${customer.displayName}"></b></td><td th:text="${customer.username}"></td><td><span th:text="${customer.email?:'—'}"></span></td><td><span class="status-pill" th:classappend="${customer.status.name()=='SUSPENDED'}?' danger'" th:text="${customer.status.name()=='ACTIVE'?'利用中':'停止中'}"></span></td><td><a class="table-link" th:href="@{/admin/customers/{id}(id=${customer.id})}">詳細・口座管理 ›</a></td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="6" class="empty-cell">該当する顧客はいません。</td></tr></tbody></table></div></section></main></div></body></html>
