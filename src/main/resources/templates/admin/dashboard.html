<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理ダッシュボード｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body class="admin-page">
<aside class="admin-sidebar"><a class="admin-logo" th:href="@{/admin}"><img th:src="@{/images/hato-bank-logo.svg}" alt="はと銀行"></a><span class="admin-mode">管理システム</span><nav><a class="active" th:href="@{/admin}">ダッシュボード</a><a th:href="@{/admin/customers}">顧客管理</a><a th:href="@{/admin/customers/new}">顧客登録・口座開設</a><a th:href="@{/admin/branches}">本支店一覧</a></nav><div class="admin-sidebar-note">銀行コード 0200<br>本店営業部 001</div></aside>
<div class="admin-shell"><header class="admin-header"><div><small>HATO BANK OPERATIONS</small><h1>管理ダッシュボード</h1></div><div class="admin-user"><span th:text="${loginName}">admin</span><b>管理者</b><form th:action="@{/logout}" method="post"><button>ログアウト</button></form></div></header>
<main class="admin-main"><section class="admin-welcome"><div><span>本日の管理業務</span><h2>顧客と口座の状態を確認できます</h2><p>この画面は学習用デモの管理機能です。</p></div><a th:href="@{/admin/customers/new}">＋ 新規顧客を登録</a></section>
<section class="metric-grid"><article><small>登録顧客</small><strong th:text="${customerCount}">0</strong><span>名</span></article><article><small>開設口座</small><strong th:text="${accountCount}">0</strong><span>口座</span></article><article class="warning"><small>凍結口座</small><strong th:text="${frozenAccountCount}">0</strong><span>口座</span></article></section>
<section class="admin-panel quick-panel"><div class="panel-heading"><div><span>QUICK ACTIONS</span><h2>管理メニュー</h2></div></div><div class="quick-links"><a th:href="@{/admin/customers}"><b>顧客を検索</b><span>顧客番号・氏名・ユーザーIDで検索</span></a><a th:href="@{/admin/customers/new}"><b>顧客を登録</b><span>ログイン情報と連絡先を登録</span></a><a th:href="@{/admin/customers}"><b>口座を管理</b><span>顧客詳細から開設・凍結・解約</span></a></div></section></main></div></body></html>
