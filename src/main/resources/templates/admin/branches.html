<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本支店一覧｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body class="admin-page">
<aside class="admin-sidebar"><a class="admin-logo" th:href="@{/admin}"><img th:src="@{/images/hato-bank-logo.svg}" alt="はと銀行"></a><span class="admin-mode">管理システム</span><nav><a th:href="@{/admin}">ダッシュボード</a><a th:href="@{/admin/customers}">顧客管理</a><a th:href="@{/admin/customers/new}">顧客登録・口座開設</a><a class="active" th:href="@{/admin/branches}">本支店一覧</a></nav><div class="admin-sidebar-note">銀行コード 0200<br>本店営業部 001</div></aside>
<div class="admin-shell"><header class="admin-header"><div><small>BRANCH DIRECTORY</small><h1>本支店一覧</h1></div><div class="admin-user"><span th:text="${loginName}">admin</span><b>管理者</b><form th:action="@{/logout}" method="post"><button>ログアウト</button></form></div></header><main class="admin-main">
<section class="admin-panel"><div class="panel-heading"><div><span>BANK CODE 0200</span><h2>はと銀行 本支店マスタ</h2></div><b th:text="${#lists.size(branches)}+'店舗'">7店舗</b></div><div class="admin-table-wrap"><table><thead><tr><th>銀行コード</th><th>支店コード</th><th>支店名</th><th>所在地</th><th>ゆかり</th></tr></thead><tbody><tr th:each="branch:${branches}"><td><code th:text="${branch.bankCode}"></code></td><td><code th:text="${branch.code}"></code></td><td><b th:text="${branch.name}"></b></td><td th:text="${branch.location}"></td><td th:text="${branch.connection}"></td></tr></tbody></table></div></section></main></div></body></html>
