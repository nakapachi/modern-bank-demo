<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/hato-login.css}"></head>
<body class="hato-login-page">
<header class="hato-login-header">
  <button class="login-menu" type="button" aria-label="メニュー"><i></i><i></i><i></i><span>メニュー</span></button>
  <a class="hato-login-brand" th:href="@{/login}" aria-label="はと銀行 ログイン"><img th:src="@{/images/hato-bank-logo.svg}" alt="はと銀行"></a>
  <a class="login-help" href="#login-help"><span>?</span><small>お困りの方</small></a>
</header>
<main class="hato-login-main">
  <section class="login-introduction">
    <p class="login-kicker">HATO DIRECT</p>
    <h1>いつもの銀行を、<br>もっと身近に。</h1>
    <p>残高照会や振込を、シンプルでわかりやすく。<br>はと銀行のインターネットバンキングです。</p>
    <div class="bank-facts"><div><small>銀行コード</small><b>201</b></div><div><small>本店 支店コード</small><b>001</b></div></div>
  </section>
  <section class="hato-login-card">
    <p class="card-label">インターネットバンキング</p><h2>ログイン</h2>
    <div class="login-error" th:if="${param.error}">ユーザー名またはパスワードが違います。</div>
    <div class="login-success" th:if="${param.logout}">ログアウトしました。</div>
    <form th:action="@{/login}" method="post">
      <label>ユーザー名<input name="username" autocomplete="username" required autofocus></label>
      <label>パスワード<input type="password" name="password" autocomplete="current-password" required></label>
      <button>ログイン</button>
    </form>
    <div class="demo-account"><div><b>デモ用ログイン</b><small>学習用環境</small></div><code>alice / demo-pass</code></div>
  </section>
</main>
<aside id="login-help" class="login-security"><span>▣</span><div><b>安全にご利用いただくために</b><small>パスワードを第三者へ伝えないでください。</small></div></aside>
<footer class="hato-login-footer"><div><b>はと銀行</b><span>銀行コード 201</span><span>学習用デモ</span></div><small>© 2026 Hato Bank Demo</small></footer>
</body></html>
