<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お取引｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/account-detail.css}"><link rel="stylesheet" th:href="@{/css/navigation.css}"></head><body class="detail-page">
<header class="detail-header"><button class="detail-menu" type="button" aria-label="メニュー" aria-controls="side-menu" aria-expanded="false"><i></i><i></i><i></i><span>メニュー</span></button><div class="detail-customer"><a class="detail-brand" th:href="@{/accounts}" aria-label="はと銀行 ホーム"><img th:src="@{/images/hato-bank-logo.svg}" alt="はと銀行"></a><b th:text="${accountHolderName}">ナカタ ヒロミ</b><span>様</span></div><div class="detail-tools"><form th:action="@{/logout}" method="post"><button><span>▣</span><small>ログアウト</small></button></form></div></header>
<div class="menu-backdrop" data-menu-close></div><nav id="side-menu" class="side-menu" aria-hidden="true"><button type="button" data-menu-close>×</button><b>はと銀行</b><a th:href="@{/accounts}">ホーム・口座一覧</a><a th:href="@{/accounts/{id}(id=${account.id})}">口座詳細</a><a th:classappend="${operation=='deposit'}?'active'" th:href="@{/accounts/{id}/deposit(id=${account.id})}">入金</a><a th:classappend="${operation=='withdraw'}?'active'" th:href="@{/accounts/{id}/withdraw(id=${account.id})}">出金</a><a th:classappend="${operation=='transfer'}?'active'" th:href="@{/accounts/{id}/transfer(id=${account.id})}">振込・振替</a><a th:href="@{/accounts/{id}/history(id=${account.id})}">入出金明細</a></nav>
<main class="detail-main"><div class="detail-topline"><a th:href="@{/accounts/{id}(id=${account.id})}">‹ 口座詳細へ戻る</a><span><span th:text="${account.branch.name + '（' + account.branch.code + '）'}">本店営業部（001）</span> <span th:text="${account.accountType.name()=='ORDINARY'?'普通預金':'貯蓄預金'}">普通預金</span> <b th:text="${account.accountNumber}"></b></span></div><div class="transaction-heading"><span th:text="${operation=='deposit'?'＋':operation=='withdraw'?'−':'⇄'}"></span><div><h1 th:text="${operation=='deposit'?'入金':operation=='withdraw'?'出金':'振込・振替'}"></h1><p>内容をご確認のうえ、お手続きください。</p></div></div><div class="detail-success" th:if="${success}" th:text="${success}"></div><div class="detail-error" th:if="${error}" th:text="${error}"></div>
<section class="single-transaction"><div class="source-summary"><small>対象口座</small><b th:text="${account.branch.name + '（' + account.branch.code + '） ' + (account.accountType.name()=='ORDINARY'?'普通預金':'貯蓄預金')}">本店営業部（001）普通預金</b><code th:text="${account.accountNumber}"></code><strong th:text="'残高 '+${#numbers.formatDecimal(account.balance,1,'COMMA',0,'POINT')}+' 円'"></strong></div>
<form th:if="${operation=='deposit'}" th:action="@{/accounts/{id}/deposit(id=${account.id})}" method="post"><label>入金額<div><input type="number" name="amount" min="0.01" step="0.01" required autofocus><span>円</span></div></label><button>入金する</button></form>
<form th:if="${operation=='withdraw'}" th:action="@{/accounts/{id}/withdraw(id=${account.id})}" method="post"><label>出金額<div><input type="number" name="amount" min="0.01" step="0.01" required autofocus><span>円</span></div></label><button>出金する</button></form>
<form th:if="${operation=='transfer'}" th:action="@{/accounts/{id}/transfer(id=${account.id})}" method="post"><label>振込先口座番号<input name="destination" inputmode="numeric" pattern="[0-9]{7}" maxlength="7" placeholder="7桁" required autofocus></label><label>振込金額<div><input type="number" name="amount" min="0.01" step="0.01" required><span>円</span></div></label><button>振り込む</button></form></section></main><script th:src="@{/js/menu.js}"></script></body></html>
