<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口座詳細｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/account-detail.css}"><link rel="stylesheet" th:href="@{/css/navigation.css}"></head><body class="detail-page">
<header class="detail-header"><button class="detail-menu" type="button" aria-label="メニュー" aria-controls="side-menu" aria-expanded="false"><i></i><i></i><i></i><span>メニュー</span></button><div class="detail-customer"><a class="detail-brand" th:href="@{/accounts}" aria-label="はと銀行 ホーム"><img th:src="@{/images/hato-bank-logo.svg}" alt="はと銀行"></a><b th:text="${accountHolderName}">ナカタ ヒロミ</b><span>様</span></div><div class="detail-tools"><a href="#detail-help"><span>?</span><small>お困りの方</small></a><form th:action="@{/logout}" method="post"><button><span>▣</span><small>ログアウト</small></button></form></div></header>
<div class="menu-backdrop" data-menu-close></div><nav id="side-menu" class="side-menu" aria-hidden="true"><button type="button" data-menu-close>×</button><b>はと銀行</b><a th:href="@{/accounts}">ホーム・口座一覧</a><a class="active" th:href="@{/accounts/{id}(id=${account.id})}">口座詳細</a><a th:href="@{/accounts/{id}/deposit(id=${account.id})}">入金</a><a th:href="@{/accounts/{id}/withdraw(id=${account.id})}">出金</a><a th:href="@{/accounts/{id}/transfer(id=${account.id})}">振込・振替</a><a th:href="@{/accounts/{id}/history(id=${account.id})}">入出金明細</a></nav>
<main class="detail-main"><div class="detail-topline"><a th:href="@{/accounts}">‹ 口座一覧へ戻る</a><span>はと銀行　銀行コード 9999</span></div><section class="detail-balance-card"><div class="detail-account-info"><div><b th:text="${account.branch.name}">本店営業部</b><span th:text="${'支店コード ' + account.branch.code}">支店コード 001</span></div><p th:text="${account.accountType.name()=='ORDINARY'?'普通預金':'貯蓄預金'}">普通預金</p><code th:text="${account.accountNumber}"></code></div><div class="detail-balance"><small>現在残高</small><strong th:text="${#numbers.formatDecimal(account.balance,1,'COMMA',0,'POINT')}+' 円'"></strong><span>最終更新　ただいま</span></div></section>
<section class="function-links"><a th:href="@{/accounts/{id}/deposit(id=${account.id})}"><span>＋</span><b>入金</b><small>口座へ入金する</small></a><a th:href="@{/accounts/{id}/withdraw(id=${account.id})}"><span>−</span><b>出金</b><small>口座から出金する</small></a><a th:href="@{/accounts/{id}/transfer(id=${account.id})}"><span>⇄</span><b>振込・振替</b><small>別口座へ振り込む</small></a><a th:href="@{/accounts/{id}/history(id=${account.id})}"><span>≡</span><b>入出金明細</b><small>取引履歴を確認する</small></a></section>
<aside id="detail-help" class="detail-note"><span>i</span><p>各種取引は上のメニューから個別画面へ進んでください。</p></aside></main><div class="detail-bank"><b>はと銀行</b><span>銀行コード 9999</span></div><script th:src="@{/js/menu.js}"></script></body></html>
