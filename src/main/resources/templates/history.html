<!doctype html><html lang="ja" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入出金明細｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/account-detail.css}"><link rel="stylesheet" th:href="@{/css/navigation.css}"></head><body class="detail-page"><header class="detail-header"><button class="detail-menu" type="button" aria-label="メニュー" aria-controls="side-menu" aria-expanded="false"><i></i><i></i><i></i><span>メニュー</span></button><div class="detail-customer"><b th:text="${loginName}">alice</b><span>様</span></div><div class="detail-tools"><form th:action="@{/logout}" method="post"><button><span>▣</span><small>ログアウト</small></button></form></div></header>
<div class="menu-backdrop" data-menu-close></div><nav id="side-menu" class="side-menu" aria-hidden="true"><button type="button" data-menu-close>×</button><b>はと銀行</b><a th:href="@{/accounts}">ホーム・口座一覧</a><a th:href="@{/accounts/{id}(id=${account.id})}">口座詳細</a><a th:href="@{/accounts/{id}/deposit(id=${account.id})}">入金</a><a th:href="@{/accounts/{id}/withdraw(id=${account.id})}">出金</a><a th:href="@{/accounts/{id}/transfer(id=${account.id})}">振込・振替</a><a class="active" th:href="@{/accounts/{id}/history(id=${account.id})}">入出金明細</a></nav>
<main class="detail-main"><div class="detail-topline"><a th:href="@{/accounts/{id}(id=${account.id})}">‹ 口座詳細へ戻る</a><span>本店（001）普通預金 <b th:text="${account.accountNumber}"></b></span></div><div class="transaction-heading"><span>≡</span><div><h1>入出金明細</h1><p>最新の取引から表示しています。</p></div></div><section class="detail-history standalone-history"><div class="history-heading"><div><h2>取引履歴</h2><span th:text="${#lists.size(entries)}+'件'"></span></div><button type="button">↻ 明細を更新</button></div><div class="detail-table-wrap"><table><thead><tr><th>取引日時</th><th>取引内容</th><th>相手口座</th><th>金額</th></tr></thead><tbody><tr th:each="e:${entries}"><td th:text="${#temporals.format(e.occurredAt,'yyyy/MM/dd HH:mm')}"></td><td th:text="${e.type}"></td><td th:text="${e.counterpartyAccount?:'—'}"></td><td th:text="${#numbers.formatDecimal(e.amount,1,'COMMA',0,'POINT')}+' 円'"></td></tr></tbody></table></div></section></main><script th:src="@{/js/menu.js}"></script></body></html>
