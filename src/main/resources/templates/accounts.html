<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホーム｜はと銀行</title><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" th:href="@{/css/dashboard.css}"><link rel="stylesheet" th:href="@{/css/navigation.css}"></head>
<body class="dashboard-page">
<header class="dashboard-header">
  <button class="menu-button" type="button" aria-label="メニュー" aria-controls="side-menu" aria-expanded="false"><i></i><i></i><i></i><span>メニュー</span></button>
  <div class="customer-name"><b th:text="${loginName}">alice</b><span>様</span></div>
  <div class="dashboard-tools"><a href="#help"><span class="tool-icon">?</span><small>お困りの方</small></a><form th:action="@{/logout}" method="post"><button><span class="lock-icon">▣</span><small>ログアウト</small></button></form></div>
</header>
<div class="menu-backdrop" data-menu-close></div><nav id="side-menu" class="side-menu" aria-hidden="true"><button type="button" data-menu-close>×</button><b>はと銀行</b><a th:href="@{/accounts}">ホーム・口座一覧</a><th:block th:if="${!#lists.isEmpty(accounts)}"><a th:href="@{/accounts/{id}(id=${accounts[0].id})}">口座詳細</a><a th:href="@{/accounts/{id}/deposit(id=${accounts[0].id})}">入金</a><a th:href="@{/accounts/{id}/withdraw(id=${accounts[0].id})}">出金</a><a th:href="@{/accounts/{id}/transfer(id=${accounts[0].id})}">振込・振替</a><a th:href="@{/accounts/{id}/history(id=${accounts[0].id})}">入出金明細</a></th:block></nav>
<main class="dashboard-main">
  <div class="last-login">前回ログイン <span>2026年8月12日 16:29</span></div>
  <div class="balance-controls" style="margin-top:24px"><button type="button">↻ <span>全口座の残高を更新</span></button><button type="button">◉ <span>残高を非表示</span></button></div>
  <section class="dashboard-account-grid">
    <a class="dashboard-account-card" th:each="a : ${accounts}" th:href="@{/accounts/{id}(id=${a.id})}">
      <div><b>本店</b><span>支店コード 001</span></div><p>普通預金</p><code th:text="${a.accountNumber}"></code>
      <strong th:text="${#numbers.formatDecimal(a.balance, 1, 'COMMA', 0, 'POINT')} + ' 円'"></strong>
    </a>
  </section>
  <section class="service-grid"><a href="#"><div><b>定期預金</b><u>定期預金口座を開設 ›</u></div><span>¥</span></a><a href="#"><div><b>資産運用</b><p>少額から資産形成を<br>始めてみませんか。</p></div><span>↗</span></a></section>
</main>
<a class="floating-transfer" th:if="${!#lists.isEmpty(accounts)}" th:href="@{/accounts/{id}/transfer(id=${accounts[0].id})}">振込・振替</a>
<div class="dashboard-bank"><b>はと銀行</b><span>銀行コード 201</span></div>
<script th:src="@{/js/menu.js}"></script>
</body></html>
